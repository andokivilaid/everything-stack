version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      clerk:
        patterns: ["@clerk/*"]
      polar:
        patterns: ["@polar-sh/*"]
      next:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      dev:
        dependency-type: development
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
