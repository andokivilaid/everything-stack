name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catches upstream breakage (Clerk, Convex, Next.js) even without commits.
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run config:check
      - name: Typecheck (convex/_generated is committed)
        run: npm run typecheck
      - run: npm run lint
      - name: Validate skills
        run: node scripts/check-skills.mjs

  e2e:
    name: Zero-signup setup, verify and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Proves the template works with zero accounts: Clerk accountless app + Convex local backend.
      - run: npm run setup -- --no-skills
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
